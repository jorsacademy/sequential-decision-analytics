name: tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pure dynamic-programming self-test
        run: python or_gym_online_knapsack_dp.py --self-test

      - name: Run regression and OR-Gymnasium integration tests
        run: python -m unittest discover -s tests -v

      - name: Run OR-Gymnasium optimization smoke experiment
        run: |
          python or_gym_online_knapsack_dp.py \
            --episodes 1000 \
            --instance-seed 20260827 \
            --evaluation-seed 10000
