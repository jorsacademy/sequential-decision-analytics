[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymdptoolbox-inventory-control"
version = "0.1.0"
description = "Finite-state stochastic inventory control with PyMDPToolbox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pymdptoolbox==4.0b3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
pymdptoolbox-inventory = "inventory_mdp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=inventory_mdp --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
